name: Release

on:
  push:
    branches: [main]
    paths: [.github/release-version]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read release version
        run: |
          $tag = (Get-Content .github/release-version -Raw).Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          $versionLine = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"'
          $version = $versionLine.Matches[0].Groups[1].Value
          if ($tag -ne "v$version") { throw 'Cargo.toml and release-version must match' }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Test
        run: cargo test --locked --offline

      - name: Build standalone EXE
        run: .\build.ps1

      - name: Generate SHA-256 checksum
        run: |
          $hash = (Get-FileHash dist/PC-Time.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PC-Time.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG dist/PC-Time.exe dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "PC Time $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
